name: AI Governance 3x Daily System

on:
  schedule:
    # 06:00 CEST (04:00 UTC)
    - cron: "0 4 * * *"

    # 13:00 CEST (11:00 UTC)
    - cron: "0 11 * * *"

    # 18:00 CEST (16:00 UTC)
    - cron: "0 16 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run governance generator
        run: python Fires/governance/generate_readme.py

      - name: Commit and push changes
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Fires/governance/README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "docs: daily AI governance insight"

          git push